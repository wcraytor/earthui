name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: pkg
          extra-packages: any::rcmdcheck, any::tinytex
          needs: check

      - name: Install LaTeX packages
        run: tinytex::tlmgr_install(c("courier", "ec", "inconsolata", "psnfss", "cm-super", "helvetic", "times", "zapfding", "symbol"))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: pkg
          # Skip the PDF reference-manual build on Windows and on R-devel:
          # the R-devel runner's minimal TeX cannot build the manual *index*
          # (the manual content itself is fine; the stable boxes below still
          # build the full indexed manual, and CRAN builds it with full TeX).
          args: ${{ (runner.os == 'Windows' || matrix.config.r == 'devel') && 'c("--as-cran", "--no-manual")' || '"--as-cran"' }}
